# Heavy MiT-B3: whole 1024x1024.
# Initial training settings, not an HPO winner.
project:
  name: satellite-change-intelligence
  seed: 42

runtime:
  device: cuda
  precision: bf16

model:
  name: siam_mit_b3_diff
  parameters:
    in_channels: 3
    out_channels: 1
    encoder_depths: [3, 4, 18, 3]
    decoder_channels: 128
    refinement_channels: [64, 32]
    norm_groups: 8
    dropout: 0.0
    attention_dropout: 0.0
    drop_path_rate: 0.1
    pretrained_backbone: false
    use_checkpointing: false

data:
  image_size: null
  batch_size: 8
  num_workers: 2

training:
  epochs: 40
  learning_rate: 0.0001
  weight_decay: 0.01
  loss:
    bce_weight: 0.3
    dice_weight: 0.7
    pos_weight: 10
  scheduler: none

output:
  directory: artifacts/final_models/heavy_resized

dataset:
  name: levir_cd
  download_url: https://drive.google.com/drive/folders/1dLuzldMRmbBNKPpUkX8Z53hi6NHLrWim
  download_directory: data/downloads/levir_cd
  prepared_directory: data/LEVIR-CD