# Provisional scratch recipe; batch size and epoch budget are not optimized.
project:
  name: satellite-change-intelligence
  seed: 42
runtime:
  device: cpu
  precision: fp32
model:
  name: siam_mit_b3_diff
  parameters:
    in_channels: 3
    out_channels: 1
    encoder_depths:
    - 3
    - 4
    - 18
    - 3
    decoder_channels: 128
    refinement_channels:
    - 64
    - 32
    norm_groups: 8
    dropout: 0.0
    attention_dropout: 0.0
    drop_path_rate: 0.1
    pretrained_backbone: false
    use_checkpointing: true
data:
  image_size: null
  batch_size: 1
  num_workers: 0
training:
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.01
  loss:
    bce_weight: 0.3
    dice_weight: 0.7
    pos_weight: 10
  scheduler: none
  thresholds:
  - 0.05
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  - 0.3
  - 0.35
  - 0.4
  - 0.45
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  - 0.85
  - 0.9
  - 0.95
output:
  directory: artifacts/heavy_full_resolution
dataset:
  name: levir_cd
  download_url: https://drive.google.com/drive/folders/1dLuzldMRmbBNKPpUkX8Z53hi6NHLrWim
  download_directory: data/downloads/levir_cd
  prepared_directory: data/LEVIR-CD
